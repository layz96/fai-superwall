<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
<title>F/AI — Онбординг</title>
<!-- Paywall.js — мост Superwall SDK ↔ страница (async обязателен). -->
<script async src="https://cdn.superwall.me/runtime/entrypoint.js"></script>
<script src="onb_lottie.min.js"></script>
<script src="onb_anims.js"></script>
<style>
:root{
  --accent:#7F86DB;--accent2:#BD62F4;--brand:linear-gradient(100deg,#7F86DB 0%,#BD62F4 100%);
  --acc-soft:rgba(127,134,219,.16);--acc-line:rgba(127,134,219,.45);
  --bg:#0A0A0A;--card:#151517;--card2:#1C1C1F;--container:#1A1A1D;
  --text:#F5F5F7;--muted:#8A8A93;--sec:#A1A1AA;--border:rgba(255,255,255,.09);
  --r-card:16px;--r-lg:20px;--r-xl:26px;--r-full:100px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",sans-serif;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;position:relative}
.pad{padding:0 20px}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;animation:fade .3s both;display:flex;flex-direction:column}.scroll::-webkit-scrollbar{display:none}
.sp{flex:1 0 10px} /* спейсер вертикального центрирования: сжимается при переполнении */
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Top bar / progress */
.top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) 20px 6px}
.back{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);color:var(--muted);flex:none;cursor:pointer}
.back svg{width:16px;height:16px}
.bar{flex:1;height:5px;border-radius:5px;background:var(--container);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--brand);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.left{font-size:12px;color:var(--muted);font-weight:600;flex:none}
.hint{padding:8px 20px 0;font-size:12.5px;color:var(--muted);font-weight:600}

/* Head */
.head{padding:18px 20px 20px}
.title{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.14}
.title .g{background:var(--brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin-top:9px;font-size:15.5px;color:var(--muted);line-height:1.45}

/* Options */
.opts{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.opt{display:flex;align-items:center;gap:13px;width:100%;padding:16px;border-radius:var(--r-card);background:var(--card);
  border:1.5px solid var(--border);font-family:inherit;font-size:16px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;transition:transform .1s,border-color .15s,box-shadow .15s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none;font-size:20px}
.opt .lbl{flex:1}.opt .chev{width:18px;height:18px;color:#4A4A52;flex:none}
/* Coach — полноэкранный выбор персонажа (game character select) */
.gamesel{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gamesel::-webkit-scrollbar{display:none}
.cslide{position:relative;flex:0 0 100%;scroll-snap-align:start;height:100%}
/* Сдвиг кадра вверх: голова уходит в верхнюю треть, инфо-блок не налазит на лицо */
.cslide img{position:absolute;left:0;right:0;top:-17%;width:100%;height:117%;object-fit:cover;object-position:center top}
.cgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.72) 0%,rgba(10,10,10,.1) 22%,rgba(10,10,10,0) 42%,rgba(10,10,10,.86) 74%,#0A0A0A 96%)}
.cinfo{position:absolute;left:0;right:0;bottom:158px;padding:0 26px;text-align:center}
.cinfo .cn{font-size:36px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cinfo .ct{font-size:14px;font-weight:700;margin-top:3px;background:var(--brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cinfo .cd{font-size:14.5px;color:#C9C9D2;line-height:1.5;margin-top:10px}
.ctraits{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:13px}
.ctag{font-size:12px;font-weight:600;color:var(--text);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px}
.cquote{font-size:13px;font-style:italic;color:#A9A9B4;line-height:1.5;margin-top:13px}
/* Заголовок в одной строке с кнопкой «назад» — не налазит на головы */
.ctop{position:absolute;top:calc(var(--safe-t) + 12px);left:0;right:0;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:5}
.ctop .ctt{flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.ctop .csp{width:32px;flex:none}
.csub{position:absolute;top:calc(var(--safe-t) + 47px);left:0;right:0;text-align:center;font-size:12px;color:rgba(220,220,228,.8);text-shadow:0 1px 10px rgba(0,0,0,.8);pointer-events:none}
.cfoot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(14px + var(--safe-b))}
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 14px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:width .2s,background .2s}
.dot.on{width:22px;border-radius:7px;background:var(--brand)}
/* Grid tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 20px}
.tile{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:20px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;text-align:center;min-height:128px;transition:transform .1s,border-color .15s,box-shadow .15s;color:var(--text);font-family:inherit}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.tile .te{width:54px;height:54px;border-radius:16px;background:var(--acc-soft);display:grid;place-items:center;font-size:27px;flex:none}
.tile .te svg{width:26px;height:26px;color:var(--accent)}
.tile .tlb{font-size:14.5px;font-weight:700;line-height:1.25}
/* нечётная последняя плитка — во всю ширину, горизонтальная */
.grid .tile:nth-child(odd):last-child{grid-column:1/-1;flex-direction:row;min-height:0;padding:15px 16px;text-align:left;justify-content:flex-start}
/* метка секции над заголовком */
.secl{padding:14px 20px 0;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.secl+.head{padding-top:8px}
/* подписи под слайдером */
.numlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
/* Segmented control (Motra-style) */
.seg{padding:0 20px}
.segbar{display:flex;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:5px;gap:4px}
.segbar button{flex:1;padding:13px 4px;border:none;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;border-radius:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.segbar button.sel{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.segdesc{margin-top:16px;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px;font-size:14px;color:var(--sec);line-height:1.5}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:9px;padding:0 20px}
.chip{padding:11px 15px;border-radius:var(--r-full);background:var(--card);border:1.5px solid var(--border);font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:.15s}
.chip.sel{background:var(--brand);color:#fff;border-color:transparent}
/* Fields */
.field{padding:0 20px}
.field input,.datew input{width:100%;padding:16px;border-radius:var(--r-card);border:1.5px solid var(--border);font-family:inherit;font-size:17px;background:var(--card);color:var(--text);outline:none;color-scheme:dark}
.field input:focus{border-color:var(--accent)}.field input::placeholder{color:#5A5A62}
.datew{padding:0 20px}
.datew input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left}
.datew input[type=date]::-webkit-date-and-time-value{text-align:left}
/* Credibility */
.statn{font-family:ui-rounded,"SF Pro Rounded",-apple-system;font-size:66px;font-weight:800;letter-spacing:-.03em;line-height:1;background:var(--brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:flex;align-items:center;gap:13px;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.badge .bi{width:46px;height:46px;border-radius:13px;background:var(--acc-soft);display:grid;place-items:center;font-size:24px;flex:none}
.badge .bt{font-size:14.5px;font-weight:700;line-height:1.3}.badge .bs{font-size:12px;color:var(--muted);margin-top:3px}
.press{display:flex;gap:8px;flex-wrap:wrap}
.press .pchip{flex:1;min-width:92px;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:13px 8px;font-size:12px;color:var(--muted);font-weight:600}
.sec-l{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:16px 20px 8px}
/* Number */
.num{text-align:center;padding:10px 20px 6px}
.num .val{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:64px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.num .val small{font-size:20px;font-weight:700;color:var(--muted)}
/* кастомный слайдер: градиентная заливка слева (через --p) + крупный thumb */
.num input[type=range]{-webkit-appearance:none;appearance:none;width:100%;margin-top:26px;height:32px;background:transparent}
.num input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;
  background:linear-gradient(100deg,var(--accent),var(--accent2)) 0/var(--p,50%) 100% no-repeat,var(--container)}
.num input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;border:none;box-shadow:0 3px 12px rgba(0,0,0,.5),0 0 0 5px var(--acc-soft);margin-top:-10px}
/* CTA dock */
.foot{padding:12px 20px calc(14px + var(--safe-b))}
.cta{width:100%;border:none;cursor:pointer;padding:18px;border-radius:var(--r-full);background:var(--brand);color:#fff;font-family:inherit;font-size:17px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.cta:active{transform:scale(.98)}.cta svg{width:18px;height:18px}
.ghost{display:block;width:100%;margin-top:10px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;margin:0 20px}
.card h3{font-size:17px;font-weight:800;margin-bottom:12px}
.ins{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:15px}.ins .d{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sum-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:15px}.sum-row:last-child{border:none}.sum-row b{font-weight:700}
/* Photo hero band */
.photo{position:relative;height:290px;margin:-1px 0 0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.15) 0%,rgba(10,10,10,.55) 55%,var(--bg) 100%)}
/* Full hero (welcome) */
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.3) 0%,rgba(10,10,10,.1) 35%,rgba(10,10,10,.75) 72%,var(--bg) 100%)}
.hero .in{position:relative;padding:0 24px calc(20px + var(--safe-b))}
.hero h1{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero p{margin-top:12px;font-size:16px;color:#D8D8DE;line-height:1.45}
.stars{display:flex;align-items:center;gap:8px;margin:16px 0 20px;font-size:13px;color:var(--sec);font-weight:600}
.stars b{color:var(--text)}
/* Data-viz: muscle bars */
.mbar{margin:11px 0}
.mbar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.mbar .lab .p{color:var(--muted);font-weight:700}
.mtrack{height:9px;border-radius:9px;background:var(--container);overflow:hidden}
.mtrack>i{display:block;height:100%;width:0;border-radius:9px;background:var(--brand);transition:width 1s cubic-bezier(.2,.8,.2,1)}
/* metric grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mcell{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:13px 14px}
.mcell .k{font-size:12px;color:var(--muted);font-weight:600}.mcell .v{font-size:22px;font-weight:800;margin-top:3px;font-family:ui-rounded,-apple-system;letter-spacing:-.01em}
/* Projection chart */
.chart{margin-top:6px}
/* Week split */
.week{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.day{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.day .dd{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--accent);flex:none}
.day .dt{font-size:15px;font-weight:700}.day .ds{font-size:12.5px;color:var(--muted);margin-top:1px}
/* Social proof */
.rate{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.rate .rr{font-size:34px;font-weight:800;font-family:ui-rounded,-apple-system}
.rate .rs{font-size:13px;color:var(--muted)}
.quote{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.quote .qt{font-size:14px;line-height:1.5}.quote .qa{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
/* Processing */
.proc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.ring{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bgc{stroke:var(--container)}.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .5s linear}
.proc .pt{font-size:17px;font-weight:700}.proc .ps{font-size:13.5px;color:var(--muted);min-height:18px}
/* Paywall extras */
.pw-check{width:60px;height:60px;margin:2px auto 12px;border-radius:50%;background:var(--brand);display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.6)}
.pw-check svg{width:28px;height:28px;color:#fff}
.feat{display:flex;align-items:center;gap:12px;margin-bottom:12px}.feat .ic{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);display:grid;place-items:center;flex:none;font-size:15px}.feat span{font-size:15px;font-weight:500}
.tl{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:14px 0}
.tlr{display:flex;gap:12px;padding:7px 0}.tlr .ti{width:28px;height:28px;border-radius:8px;background:var(--acc-soft);display:grid;place-items:center;flex:none;font-size:14px}
.tlr .tt{font-size:13.5px;font-weight:700}.tlr .tsx{font-size:12px;color:var(--muted);margin-top:1px}
.plan{position:relative;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-radius:var(--r-card);border:1.5px solid var(--border);background:var(--card);cursor:pointer;margin-bottom:10px;transition:.18s}
.plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.plan .t{font-size:15px;font-weight:700}.plan .s{font-size:12.5px;color:var(--muted)}
.plan .p{font-size:15px;font-weight:700;text-align:right}.plan .p small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.plan .save{position:absolute;top:-9px;right:14px;font-size:10px;font-weight:700;color:#fff;background:var(--brand);padding:3px 9px;border-radius:999px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.22);flex:none;display:grid;place-items:center;margin-left:12px}
.plan.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--brand)}
.pwsoc{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.links{margin-top:10px;display:flex;justify-content:center;gap:6px;font-size:12px;color:var(--muted)}.links a{color:var(--muted);text-decoration:underline}
/* ── Round 4: живые композиции ── */
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.chatwrap{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.cbub{max-width:82%;padding:12px 15px;font-size:14.5px;line-height:1.45;border-radius:18px;border-bottom-left-radius:6px;background:var(--card2);border:1px solid var(--border);align-self:flex-start;opacity:0;animation:bubin .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.cbub.me{align-self:flex-end;background:var(--brand);color:#fff;border:none;border-radius:18px;border-bottom-right-radius:6px;font-weight:600}
.cbub .cavm{width:22px;height:22px;border-radius:7px;object-fit:cover;object-position:center 12%;vertical-align:-6px;margin-right:7px}
.ctyping{display:inline-flex;gap:4px;padding:13px 15px}
.ctyping i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite}
.ctyping i:nth-child(2){animation-delay:.2s}.ctyping i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.planupd{align-self:center;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--acc-line);border-radius:14px;padding:11px 16px;font-size:13.5px;font-weight:700;opacity:0;animation:bubin .45s forwards;animation-delay:var(--d);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.planupd .pu{color:var(--accent)}
/* стопка карточек упражнений */
.stackw{position:relative;height:320px;margin:6px 24px 0}
@keyframes cardin{from{opacity:0;transform:translateY(18px) rotate(var(--rot))}to{opacity:1;transform:rotate(var(--rot))}}
.scard{position:absolute;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 16px;font-size:14.5px;font-weight:700;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;animation:cardin .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
.scard small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.sdots{display:flex;gap:5px;margin-top:9px}
.sdots i{flex:1;height:4px;border-radius:4px;background:var(--container)}
.sdots i.on{background:var(--brand)}
/* недельный ряд с чекмарками */
.weekrow{display:flex;gap:7px;margin:2px 0 12px}
.wd{flex:1;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);position:relative}
.wd.on{background:var(--brand);color:#fff;border:none}
.wd.on::after{content:'✓';position:absolute;font-size:13px;font-weight:800}
.wd.on span{display:none}
.wd{opacity:0;animation:bubin .35s forwards;animation-delay:var(--d)}
/* iOS-нотификация превью */

function mountLottie(id,name,loop=true){
  const el=document.getElementById(id);

  try{const a=lottie.loadAnimation({container:el,renderer:'svg',loop,autoplay:true,animationData:JSON.parse(JSON.stringify(data))});window.__lots.push(a);return a;}

function idxInRoute(){const r=route();return r.findIndex(s=>s.id===S[cur]?.id);}

function questionsLeft(){const r=route();const i=idxInRoute();const planI=r.findIndex(s=>s.id==='plan');let n=0;for(let k=i+1;k<planI;k++){if(QT.includes(r[k].t))n++;}return n;}

function next(){let j=cur+1;while(j<S.length&&S[j].when&&!S[j].when(A))j++;go(j);}

function topBar(showHint){
  const w=Math.round(Math.pow(progFrac(),1.35)*100); // медленный старт (Noom-трюк)
  const ql=questionsLeft();
  // Ресёрч (Noom): в начале длину маскируем («≈2 минуты»), число вопросов — ближе к концу.
  let hint='';
  if(showHint&&ql>0){
    const txt=ql>10?'≈ 2 минуты до твоей программы'
      :(ql>3?`Ещё ${ql} ${plural(ql,'вопрос','вопроса','вопросов')} до твоей программы`
      :`Почти готово — ${ql} ${plural(ql,'вопрос','вопроса','вопросов')}`);
    hint=`<div class="hint">${txt}</div>`;
  }
  return `<div class="top"><div class="back" onclick="back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div><div class="bar"><i style="width:${w}%"></i></div></div>${hint}`;
}

      <div id="lotproc" class="lotc" style="width:280px;height:280px"></div>
    </div>
    <div style="padding:0 24px calc(34px + var(--safe-b));text-align:center">
      <div class="ps" id="ps" style="font-size:13.5px;color:var(--muted);min-height:18px"></div>
    </div>`;
  mountLottie('lotproc','onb_anim_ring_breathe',true);
  const ps=document.getElementById('ps');
  let i=0;
  const step=()=>{
    if(i<phases.length){ps.textContent=phases[i];i++;setTimeout(step,900);return;}
    // Фаза 2: дот-силуэт
    destroyLots();
    const el=document.getElementById('lotproc');
    if(el){el.style.width='320px';el.style.height='438px';}
    mountLottie('lotproc','onb_anim_dots_figure',false);
    ps.textContent='Персонализирую программу под тебя…';
    setTimeout(()=>next(),2300);
  };
  step();
}

// Plan reveal
function weekSplit(){
  const d=A.days||3;const g=A.goal;
  let tmpl;
  if(g==='lose_weight')tmpl=[['Всё тело + кардио'],['HIIT + кор'],['Низ тела'],['Верх тела'],['Кардио + кор'],['Всё тело']];
  else if(g==='strength')tmpl=[['Присед · сила'],['Жим · сила'],['Тяга · сила'],['Присед · объём'],['Жим · объём'],['Аксессуары']];
  else tmpl=[['Грудь + Трицепс'],['Спина + Бицепс'],['Ноги + Плечи'],['Верх тела'],['Низ тела'],['Всё тело']];
  // Дни распределяются с отдыхом между тренировками (а не подряд).
  const DAYS={1:['ПН'],2:['ПН','ЧТ'],3:['ПН','СР','ПТ'],4:['ПН','ВТ','ЧТ','ПТ'],5:['ПН','ВТ','СР','ЧТ','ПТ'],6:['ПН','ВТ','СР','ЧТ','ПТ','СБ']}[Math.min(6,Math.max(1,d))];
  return DAYS.map((day,i)=>[day,tmpl[i%tmpl.length][0]]);
}
function projChart(){
  // линия старт→цель за 12 недель
  const up=A.goal==='gain_muscle'||A.goal==='strength';const down=A.goal==='lose_weight';
  const pts=[];for(let i=0;i<=12;i++){let y;if(down)y=70-(i/12)*42;else if(up)y=70-(i/12)*46;else y=64-(i/12)*30;pts.push([8+i*(300/12),y+8]);}
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(0)+' '+p[1].toFixed(0)).join(' ');
  const area=`M8 118 `+pts.map(p=>'L'+p[0].toFixed(0)+' '+p[1].toFixed(0)).join(' ')+` L308 118 Z`;
  const label=down?'−'+((A.weight||80)-(A.target_weight||72))+' кг':(up?'+сила и объём':'форма и тонус');
  return `<svg class="chart" viewBox="0 0 316 128" width="100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="url(#rg)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${pts[12][0]}" cy="${pts[12][1]}" r="5" fill="var(--accent2)"/>
    <text x="8" y="14" fill="var(--muted)" font-size="11" font-family="-apple-system">Сегодня</text>
    <text x="250" y="14" fill="var(--text)" font-size="12" font-weight="700" font-family="-apple-system">12 нед · ${label}</text></svg>`;
}
function renderPlan(){
  const nm=A.name?`, ${A.name}`:'';
  const split=weekSplit();
  const onDays=split.map(w=>w[0]);
  const WD=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
  const weekrow=WD.map((d,i)=>`<div class="wd${onDays.includes(d)?' on':''}" style="--d:${.4+i*.12}s"><span>${d}</span></div>`).join('');
  const days=split.map(w=>`<div class="day"><div class="dd">${w[0]}</div><div><div class="dt">${w[1]}</div><div class="ds">${A.duration||45} мин · ${(A.area==='home'?'дома':A.area==='street'?'на улице':'в зале')}</div></div></div>`).join('');
  wrap.innerHTML=`${topBar(false)}
  <div class="confov" id="confov"></div>
  <div class="scroll">
    <div class="head" style="padding-top:6px"><div class="title">Готово${nm}!<br><span class="g">Твоя программа собрана</span></div><div class="sub">На основе твоих ${Object.keys(A).length} ответов. Цель — ${GL[A.goal]||'твоя форма'}.</div></div>
    <div class="card"><div style="font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:10px">ТВОЯ НЕДЕЛЯ · ${A.days||3} ${plural(A.days||3,'тренировка','тренировки','тренировок')}</div><div class="weekrow">${weekrow}</div><div class="week">${days}</div></div>
    <div class="card" style="margin-top:12px"><div style="font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:8px">ПРОГНОЗ · 12 НЕДЕЛЬ</div>${projChart()}</div>
    <div style="height:8px"></div>
  </div>
  <div class="foot"><button class="cta" onclick="next()"><span>Открыть программу 🚀</span></button></div>`;
  mountLottie('confov','onb_anim_confetti',false); // одноразовое конфетти (aha-момент)
}

// Paywall
let plan='yearly';
function renderPaywall(){
  const nm=A.name?`, ${A.name}`:'';const gl=GL[A.goal]||'твоей цели';const cnt=Object.keys(A).length;
  wrap.innerHTML=`
  <div class="scroll">
    <div style="display:flex;justify-content:center;padding:calc(var(--safe-t) + 16px) 0 2px">
      <video src="onb_demo.mp4" autoplay muted loop playsinline
        style="width:47%;border-radius:24px;border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.65)"></video>
    </div>
    <div class="head" style="text-align:center;padding-top:14px;padding-bottom:12px"><div class="title" style="font-size:24px">Твоя программа для <span class="g">${gl}</span>${nm} готова</div><div class="sub">Собрана на основе твоих ${cnt} ответов.</div></div>
    <div class="pad">
      <div class="plan sel" id="py" onclick="selPlan('yearly')"><div class="save">ВЫГОДНО −40%</div><div><div class="t">Год</div><div class="s">≈ 249 ₽ в месяц</div></div><div style="display:flex;align-items:center"><div class="p">2 990 ₽<small>в год</small></div><div class="radio"></div></div></div>
      <div class="plan" id="pm" onclick="selPlan('monthly')"><div><div class="t">Месяц</div><div class="s">Гибкая помесячная оплата</div></div><div style="display:flex;align-items:center"><div class="p">399 ₽<small>в месяц</small></div><div class="radio"></div></div></div>
    </div>
    <div class="pad" style="margin:14px 0 2px">
      <div class="feat"><span class="ic">✨</span><span>AI-персонализация под твои ответы</span></div>
      <div class="feat"><span class="ic">💬</span><span>Безлимитный чат с тренером</span></div>
      <div class="feat"><span class="ic">📈</span><span>Прогресс, аналитика и адаптация плана</span></div>
    </div>
    <div style="height:6px"></div>
  </div>
  <div class="foot">
    <button class="cta shimmer" onclick="finish('purchase')"><span>Открыть полный доступ</span></button>
    <div class="pwsoc">Отмена подписки в любой момент</div>
    <div class="links"><a onclick="finish('restore')">Восстановить</a></div>
    <button class="ghost" onclick="finish('skip')">Продолжить без программы</button>
  </div>`;
}
function selPlan(p){plan=p;document.getElementById('py').classList.toggle('sel',p==='yearly');document.getElementById('pm').classList.toggle('sel',p==='monthly');}
function done(){destroyLots();renderPaywall();}
// Финал → Superwall (Paywall.js перехватывает клики по data-pw-кнопкам):
// purchase — покупка выбранного плана (primary=год/secondary=месяц), restore — восстановление,
// skip — закрыть пейвол (кампания не-gated → пользователь проходит дальше в приложение).
function finish(action){
  const id=action==='purchase'?(plan==='yearly'?'pw-buy-primary':'pw-buy-secondary')
          :action==='restore'?'pw-restore':'pw-close';
  const btn=document.getElementById(id);
  if(btn)btn.click();
}
next();
</script>
</body></html>
